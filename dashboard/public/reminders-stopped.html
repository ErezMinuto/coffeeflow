<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F6F2">
  <title>התזכורות הופסקו · מינוטו</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      background: #F7F6F2;
      font-family: 'Heebo', 'Segoe UI', Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      direction: rtl;
      text-align: center;
      padding: 48px 16px;
      color: #1C211A;
    }
    .logo {
      display: block;
      height: 96px;
      width: auto;
      margin: 0 auto 20px;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 1px solid #E6E3DB;
      border-radius: 10px;
      padding: 36px 28px 28px;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: #ECEFE4;
      color: #3D4A2E;
    }
    .mark.warn { background: #FCF5E8; color: #A15C07; }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 12px; color: #1C211A; }
    p  { font-size: 15px; line-height: 1.7; color: #4A5045; margin: 0 0 8px; }
    .footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #E6E3DB;
      font-size: 13px;
      color: #7A7F73;
    }
    a { color: #3D4A2E; font-weight: 500; }
    @media (max-width: 480px) {
      body { padding: 32px 16px; }
      .logo { height: 80px; }
      .card { padding: 28px 20px 22px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <img class="logo" src="/logo.png" alt="Minuto">
  <main class="card">
    <div id="ok">
      <span class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <h1>התזכורות הופסקו</h1>
      <p>לא נשלח לך יותר תזכורות להזמנה חוזרת.</p>
      <p>עדכוני הזמנה ומיילים אחרים שביקשת ימשיכו להגיע כרגיל.</p>
    </div>
    <div id="bad" style="display:none;">
      <span class="mark warn" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/></svg>
      </span>
      <h1>הקישור לא תקין</h1>
      <p>לא הצלחנו לעדכן את ההעדפה דרך הקישור הזה.</p>
      <p>אפשר לכתוב לנו ל־<a href="mailto:info@minuto.co.il">info@minuto.co.il</a> ונפסיק את התזכורות ידנית.</p>
    </div>
    <div class="footer">תודה, צוות מינוטו</div>
  </main>
  <script>
    (function () {
      var status = new URLSearchParams(location.search).get('status') || 'ok';
      if (status !== 'ok') {
        document.getElementById('ok').style.display = 'none';
        document.getElementById('bad').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
