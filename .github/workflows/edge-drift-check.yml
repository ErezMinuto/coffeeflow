name: Edge function drift check

# WHY THIS EXISTS
#
# Edge functions are deployed by hand (`supabase functions deploy …`), so git
# and production drift apart silently and by default. On 2026-08-21 an audit of
# the 14 functions that bundle `seo-agent/*` found SIX of them diverged, and the
# divergence was invisible until someone tried to deploy:
#
#   mission-worker             prod +480 lines — the entire Daily IG cadence
#                              mission existed ONLY in production
#   seo-worker-writer          prod-only catalog/permalink matching
#   industry-intelligence-sync prod-only Chrome UA; git still had the UA that
#                              Perfect Daily Grind's WAF 403s
#   seo-worker-visual          prod-only bag-slide guards
#   organic-orchestrator       prod and git each had a DIFFERENT
#                              anti-cannibalization implementation
#   handle-seo-chat            git +400 lines never deployed
#
# Deploying any of those from git would have deleted live, working code. This
# job makes that state visible within a day instead of at deploy time.
#
# It is READ-ONLY: it downloads each deployed function and diffs it against the
# committed source. It never deploys and never writes to Supabase.
#
# Required: a SUPABASE_ACCESS_TOKEN secret scoped to the `edge-drift-check`
# ENVIRONMENT — deliberately NOT a repo-level secret.
#
# Repo secrets are readable by every workflow in the repo, and fixer-agent.yml
# states the rule this would have broken: "by design the agent has no credential
# that can deploy or migrate." A Supabase access token can do both. Scoping it to
# an environment means only a job that declares `environment: edge-drift-check`
# can see it — this job does, fixer-agent does not.
#
# Setup:
#   1. Settings → Environments → New environment → `edge-drift-check`
#   2. Add an environment secret SUPABASE_ACCESS_TOKEN, from
#      https://supabase.com/dashboard/account/tokens
#
# Note: Supabase personal access tokens are account-wide. Confirm on that page
# whether a narrower scope is available before minting one; if not, the
# environment scoping above is what limits the blast radius.
#
# Until the secret exists, this job fails with a message saying so.

on:
  schedule:
    - cron: '0 5 * * *'      # 05:00 UTC daily, before the working day in Israel
  workflow_dispatch:          # Actions → Edge function drift check → Run workflow
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

concurrency:
  group: edge-drift-check
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    # Gates access to the SUPABASE_ACCESS_TOKEN secret — see the note above.
    environment: edge-drift-check
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ytydgldyeygpzmlxvpvb
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the access token is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Compare every deployed function against this commit
        run: bash scripts/check-edge-drift.sh
        env:
          DRIFT_DEBUG: '1'
