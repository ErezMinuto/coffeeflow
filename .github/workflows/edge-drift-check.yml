name: Edge function drift check

# WHY THIS EXISTS
#
# Until 2026-10-10 edge functions were deployed by hand, so git and production
# drifted apart silently. On 2026-08-21 six functions had production-only code
# (mission-worker: +480 live lines that git never had). A deploy from git
# deletes such code.
#
# Since 2026-10-10 deploys come from CI (deploy-edge-functions.yml), whose
# guard refuses any function that drifted. This job lists ALL drifted
# functions at once, so they can be reconciled before someone touches them.
#
# HOW IT COMPARES
#   scripts/check-edge-drift.sh runs the deploy guard against HEAD for every
#   function: the whole deployed bundle, canonicalised through esbuild,
#   because production serves code with TypeScript types erased. (That erasure
#   is why the previous text comparison reported 100% drift on the runner.)
#
# READ-ONLY: downloads and compares, never deploys, never writes to Supabase.
#
# Uses the edge-deploy environment's SUPABASE_ACCESS_TOKEN: an environment
# secret, so fixer-agent.yml (which must never hold a credential that can
# deploy) still cannot see it.

on:
  workflow_dispatch:          # Actions → Edge function drift check → Run workflow
    inputs:
      functions:
        description: 'Only these functions, space-separated (empty = all)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 3 * * 1'      # Mondays 06:17 Israel time

concurrency:
  group: edge-drift-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: edge-deploy
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ytydgldyeygpzmlxvpvb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history: tells "prod is behind git" from "prod-only code"

      - name: Fail early if the access token is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in the edge-deploy environment."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.1

      - name: Install esbuild
        run: npm install -g esbuild@0.25.10

      # If esbuild's output ever shifts, every deploy would be refused (or,
      # worse, a real difference hidden). Prove the canonical form first.
      - name: Self-test the guard's canonical form
        run: bash scripts/ci/edge_canon_test.sh

      - name: Compare every deployed function against this commit
        env:
          ONLY: ${{ inputs.functions }}
        run: |
          case "$ONLY" in *[!a-z0-9\ -]*) echo "::error::Bad function list"; exit 1 ;; esac
          set +e
          DRIFT_REPORT="$RUNNER_TEMP/drift.md" bash scripts/check-edge-drift.sh $ONLY | tee "$RUNNER_TEMP/drift.log"
          rc=${PIPESTATUS[0]}
          . "$RUNNER_TEMP/drift.md.vars" 2>/dev/null
          {
            echo "### Edge drift @ ${GITHUB_SHA:0:7}"
            echo
            echo "**In sync:** $(echo $CLEAN | wc -w)  **Drifted:** $(echo $DRIFT | wc -w)  **Not deployed:** $(echo $MISSING | wc -w)  **Could not compare:** $(echo $FAILED | wc -w)"
            echo
            [ -n "${DRIFT:-}" ] && cat "$RUNNER_TEMP/drift.md"
            [ -n "${FAILED:-}" ] && echo "Could not compare: $FAILED"
          } >> "$GITHUB_STEP_SUMMARY"
          # One annotation with the whole result, so it is readable from the run page.
          msg="$(tail -n 200 "$RUNNER_TEMP/drift.log" | sed -n '/^in sync:/,$p' | head -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          if [ "$rc" -eq 0 ]; then echo "::notice title=No drift::$msg"; else echo "::error title=Edge drift::$msg"; fi
          exit $rc
